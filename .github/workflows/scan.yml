name: market-scan

# 국내 전체(코스피·코스닥) + 미국 전체(NYSE·NASDAQ·AMEX + OTC) 추세선 매수권 스캔.
# 결과(scan_kr.json, scan_us.json)를 'scan-latest' 사전 릴리스에 올리면 앱이 받아서 사용합니다.
# ※ schedule 은 기본 브랜치(main)에 이 파일이 있어야 동작합니다.
on:
  schedule:
    - cron: "43 7 * * 1-5"    # 국내 장 마감 후 (16:43 KST)
    - cron: "37 21 * * 1-5"   # 미국 장 마감 후 (뉴욕 16:37~17:37)
  workflow_dispatch:
  push:
    branches: [ccr-fd613a48-5b8fld]
    paths: ["android/core/src/main/**", ".github/workflows/scan.yml"]

permissions:
  contents: write

concurrency:
  group: market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: 국내 전체 스캔
        continue-on-error: true
        run: ./gradlew :core:scan --args="KR $PWD/scan/scan_kr.json"

      - name: 미국 전체 스캔 (OTC 포함)
        continue-on-error: true
        run: ./gradlew :core:scan --args="US $PWD/scan/scan_us.json"

      - name: 결과 게시 (scan-latest)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la scan/
          gh release view scan-latest >/dev/null 2>&1 || gh release create scan-latest --prerelease \
            --title "전체 시장 스캔 결과 (앱 데이터)" \
            --notes "앱이 사용하는 전체 종목 추세선 매수권 스캔 결과입니다. 매일 장 마감 후 자동 갱신됩니다."
          gh release upload scan-latest scan/*.json --clobber
