name: android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: 추천 엔진 테스트 (Python 결과와 일치 검증 포함)
        run: ./gradlew :core:test --stacktrace

      - name: 네이버 시세 연동 확인
        continue-on-error: true
        env:
          NETWORK_TESTS: "1"
        run: ./gradlew :core:test --tests "*DataTest.liveNaverData" --rerun-tasks -i | grep -E "fchart|marketValue|기본 목록|FAILED|PASSED|Exception" || true

      - name: APK 빌드
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: APK 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk stock-recommender.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stock-recommender-apk
          path: android/stock-recommender.apk

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stock-recommender-apk
      - name: KVM 활성화
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 에뮬레이터에서 실행 + 스크린샷
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash android/scripts/emulator_screenshots.sh stock-recommender.apk shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
