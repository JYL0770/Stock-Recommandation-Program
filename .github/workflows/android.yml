name: android

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: 추천 엔진 테스트 (Python 결과와 일치 검증 포함)
        run: ./gradlew :core:test --stacktrace

      - name: 네이버 시세 연동 확인
        continue-on-error: true
        env:
          NETWORK_TESTS: "1"
        run: ./gradlew :core:test --tests "*DataTest.liveNaverData" --rerun-tasks -i | grep -E "fchart|marketValue|기본 목록|FAILED|PASSED|Exception" || true

      - name: 매수권 실시장 스캔 (종목·지수 일봉/주봉, 코스피·코스닥 시총 상위 각 300)
        continue-on-error: true
        env:
          NETWORK_TESTS: "1"
        run: ./gradlew :core:test --tests "*TrendTest.liveScan" --tests "*YahooTest.liveUsScan" --rerun-tasks -i | grep "TREND|" || true

      - name: APK 빌드
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: APK 이름 정리
        run: cp app/build/outputs/apk/release/app-release.apk stock-recommender.apk

      - uses: actions/upload-artifact@v4
        with:
          name: stock-recommender-apk
          path: android/stock-recommender.apk

  screenshots:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stock-recommender-apk
      - name: KVM 활성화
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 에뮬레이터에서 실행 + 스크린샷
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash android/scripts/emulator_screenshots.sh stock-recommender.apk shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
      - name: 스크린샷을 로그로 출력 (아티팩트 접근이 어려운 환경용)
        if: always()
        run: |
          for f in shots/*.png shots/*.txt; do
            [ -f "$f" ] || continue
            echo "SHOT_BEGIN $(basename "$f")"; base64 -w 100 "$f" | sed 's/^/B64 /'; echo "SHOT_END"
          done

  release:
    # 휴대폰 브라우저에서 바로 받을 수 있도록 최신 APK 를 'android-latest' 사전 릴리스로 게시
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stock-recommender-apk
      - name: 사전 릴리스 갱신
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest stock-recommender.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Android 앱 최신 빌드 (${GITHUB_SHA::7})" \
            --notes "가격 지표 기반 주식 추천 Android 앱. 휴대폰에서 stock-recommender.apk 를 받아 설치하세요 (Android 8.0 이상, '알 수 없는 앱 설치' 허용 필요). 브랜치: ${GITHUB_REF_NAME}"
